<div class="dashboard-layout">
  <app-header
    variant="dashboard"
    badgeText="CORE TRACKER"
    [userEmail]="userEmail"
    (logout)="onLogout()"
  ></app-header>

  <main class="content-container">
    <section class="toolbar-section">
      <div class="toolbar-left">
        <h2>Support Tickets</h2>
        <p class="section-subtitle">Track, filter, and resolve technical issues with architectural precision</p>
      </div>

      <div class="toolbar-right">
        <div class="filter-wrapper">
          <label for="status-filter-select" class="filter-label">Status Filter</label>
          <select
            id="status-filter-select"
            data-testid="status-filter"
            [(ngModel)]="selectedStatus"
            (change)="onFilterChange()"
            class="native-select"
          >
            <option value="All">All Statuses</option>
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
            <option value="Closed">Closed</option>
          </select>
        </div>

        <button
          type="button"
          data-testid="ticket-new"
          (click)="openCreateModal()"
          class="btn btn-primary"
        >
          + Create Ticket
        </button>
      </div>
    </section>

    <!-- Loading State -->
    <div *ngIf="loading()" data-testid="list-loading" class="loading-state">
      <div class="spinner"></div>
      <span>Loading ticket stream...</span>
    </div>

    <!-- Empty State -->
    <div
      *ngIf="!loading() && tickets().length === 0"
      data-testid="ticket-empty"
      class="empty-card"
    >
      <div class="empty-icon-wrap">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="1"/>
          <path d="M7 8h10M7 12h6M7 16h4"/>
        </svg>
      </div>
      <h3>No tickets found</h3>
      <p>No tickets match the selected filter or your account has no tickets.</p>
    </div>

    <!-- Ticket List Grid -->
    <div
      *ngIf="!loading() && tickets().length > 0"
      data-testid="ticket-list"
      class="ticket-grid"
    >
      <app-ticket
        *ngFor="let ticket of tickets()"
        [ticket]="ticket"
        (edit)="openEditModal($event)"
        (delete)="openDeleteModal($event)"
      ></app-ticket>
    </div>
  </main>

  <!-- Dedicated Ticket Form Modal -->
  <app-ticket-form
    [isOpen]="isFormModalOpen()"
    [initialTicket]="editingTicket"
    [isSubmitting]="isSubmitting()"
    [serverError]="formServerError()"
    (save)="onSaveTicket($event)"
    (cancel)="closeFormModal()"
  ></app-ticket-form>

  <!-- Dedicated Delete Confirmation Modal -->
  <app-confirm-dialog
    [isOpen]="isConfirmModalOpen()"
    [itemTitle]="deletingTicket?.title || ''"
    (confirm)="onConfirmDelete()"
    (cancel)="closeDeleteModal()"
  ></app-confirm-dialog>
</div>
