<article data-testid="ticket-row" [attr.data-ticket-id]="ticket._id" class="ticket-card">
  <div class="ticket-card-header">
    <div class="title-group">
      <span [ngClass]="priorityBadgeClass">
        • {{ ticket.priority }} Priority
      </span>
      <span data-testid="ticket-status" [ngClass]="statusBadgeClass">
        {{ ticket.status }}
      </span>

    </div>
    <time class="ticket-date">
      {{ ticket.createdAt | date: 'mediumDate' }}
    </time>
  </div>

  <div class="ticket-card-body">
    <h3 data-testid="ticket-title" class="ticket-title">
      {{ ticket.title }}
    </h3>
    <p *ngIf="ticket.description" class="ticket-desc">
      {{ ticket.description }}
    </p>
  </div>

  <div class="ticket-card-footer">
    <div class="quick-status-wrap">
      <label [for]="'status-' + ticket._id" class="quick-status-label">Status:</label>
      <select
        [id]="'status-' + ticket._id"
        [value]="ticket.status"
        (change)="onStatusSelect($event)"
        class="quick-status-select"
        data-testid="ticket-quick-status"
        title="Quick change ticket status"
      >
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
        <option value="Closed">Closed</option>
      </select>
    </div>

    <div class="footer-actions">
      <button type="button" data-testid="ticket-edit" (click)="onEdit()" class="btn btn-secondary btn-sm">
        Edit
      </button>
      <button type="button" data-testid="ticket-delete" (click)="onDelete()" class="btn btn-danger-outline btn-sm">
        Delete
      </button>
    </div>
  </div>
</article>
